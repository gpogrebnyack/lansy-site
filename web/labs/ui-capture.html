<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>UI capture</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body>
<!-- capture helper: shows one screen of the hero's product UI full-frame, at its own size, for device mockups (mckp).
     ?scr=0..3 (Summary, Members, Goals, Best practices). Screenshot this page at the device's screen size. -->
<iframe id="f" src="../index.html?capture=1"></iframe>
<script>
const SCR=+(new URLSearchParams(location.search).get('scr')||0);
document.getElementById('f').onload=()=>setTimeout(()=>{const d=document.getElementById('f').contentDocument, a=d.querySelector('.ui-app');
  const W=innerWidth, H=innerHeight, k=W/1600;   // in the hero the app sits on frosted glass; on a device it gets the product's own light grey
  const st=d.createElement('style'); st.textContent='body>*:not(.cap-wrap){visibility:hidden!important}.cap-wrap .ui-tip{display:none!important}'; d.head.append(st);
  const wrap=d.createElement('div'); wrap.className='cap-wrap'; wrap.style.cssText='position:fixed;inset:0;z-index:2147483647;overflow:hidden;background:#F2F2F0';
  const c=a.cloneNode(true); c.style.cssText+=`;position:absolute;left:0;top:0;transform:scale(${k});transform-origin:0 0`;
  c.querySelectorAll('.ui-scr').forEach((s,i)=>{s.classList.toggle('on',i===SCR); s.style.opacity=i===SCR?1:0; s.style.transition='none';});
  wrap.append(c); d.body.append(wrap); d.documentElement.style.overflow='hidden'; document.title='ready';},2500);
</script>
</body></html>
